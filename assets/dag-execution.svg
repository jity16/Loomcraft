<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="820" height="348" viewBox="0 0 820 348" role="img"
     aria-label="An animated LoomCraft plan running: clean succeeds, profile and outliers are dispatched together because neither depends on the other, outliers fails and is retried with backoff, report fans in once both parents succeed, and answer completes the plan.">
  <title>A LoomCraft plan executing: parallel layers, a retry with backoff, and a fan-in</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#141d34"/>
    </linearGradient>
    <filter id="led" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <style>
      .t { font-family: ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
      .m { font-family: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    </style>
  </defs>

  <rect width="820" height="348" rx="14" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="818.5" height="346.5" rx="13.25" fill="none" stroke="#22304d"/>

  <!-- ── header ─────────────────────────────────────────────────────────── -->
  <text class="t" x="26" y="30" fill="#e2e8f0" font-size="14" font-weight="600">Assess the quality of the uploaded sales table</text>
  <text class="m" x="26" y="47" fill="#7d8da8" font-size="10.5">revision 1 · 5 steps · DAG validated at publish time</text>

  <g class="m" font-size="10" fill="#94a3b8">
    <circle cx="524" cy="26" r="4" fill="#64748b"/><text x="534" y="30">pending</text>
    <circle cx="596" cy="26" r="4" fill="#fbbf24"/><text x="606" y="30">running</text>
    <circle cx="668" cy="26" r="4" fill="#fb7185"/><text x="678" y="30">failed</text>
    <circle cx="732" cy="26" r="4" fill="#34d399"/><text x="742" y="30">succeeded</text>
  </g>

  <!-- ── layer rulers ───────────────────────────────────────────────────── -->
  <g class="m" font-size="9.5" fill="#566380" text-anchor="middle">
    <text x="118" y="72" fill="#566380">layer 0</text>
    <text x="314" y="72" fill="#566380">layer 1</text>
    <text x="510" y="72" fill="#566380">layer 2</text>
    <text x="706" y="72" fill="#566380">layer 3</text>
  </g>

  <!-- ── the parallel band around layer 1 ───────────────────────────────── -->
  <rect x="224" y="80" width="180" height="196" rx="12" fill="#fbbf24" fill-opacity="0.03"
        stroke="#33415c" stroke-width="1.2" stroke-dasharray="4 5">
    <animate attributeName="stroke" dur="12s" repeatCount="indefinite" calcMode="discrete"
             values="#33415c;#fbbf24;#33415c" keyTimes="0;0.2667;0.6333"/>
  </rect>

  <!-- ── edges: base ────────────────────────────────────────────────────── -->
  <g fill="none" stroke="#263149" stroke-width="2">
    <path d="M196,176 C216,176 216,118 236,118"/>
    <path d="M196,176 C216,176 216,234 236,234"/>
    <path d="M392,118 C412,118 412,176 432,176"/>
    <path d="M392,234 C412,234 412,176 432,176"/>
    <path d="M588,176 L628,176"/>
  </g>

  <!-- ── edges: the "satisfied" overlay, drawn in when the parent succeeds ─ -->
  <g fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"
     pathLength="100" stroke-dasharray="100">
    <path d="M196,176 C216,176 216,118 236,118" pathLength="100">
      <animate attributeName="stroke-dashoffset" dur="12s" repeatCount="indefinite"
               values="100;100;0;0" keyTimes="0;0.25;0.30;1"/>
    </path>
    <path d="M196,176 C216,176 216,234 236,234" pathLength="100">
      <animate attributeName="stroke-dashoffset" dur="12s" repeatCount="indefinite"
               values="100;100;0;0" keyTimes="0;0.25;0.30;1"/>
    </path>
    <path d="M392,118 C412,118 412,176 432,176" pathLength="100">
      <animate attributeName="stroke-dashoffset" dur="12s" repeatCount="indefinite"
               values="100;100;0;0" keyTimes="0;0.5;0.55;1"/>
    </path>
    <path d="M392,234 C412,234 412,176 432,176" pathLength="100">
      <animate attributeName="stroke-dashoffset" dur="12s" repeatCount="indefinite"
               values="100;100;0;0" keyTimes="0;0.6333;0.68;1"/>
    </path>
    <path d="M588,176 L628,176" pathLength="100">
      <animate attributeName="stroke-dashoffset" dur="12s" repeatCount="indefinite"
               values="100;100;0;0" keyTimes="0;0.8;0.85;1"/>
    </path>
  </g>

  <!-- ── arrowheads (green only once the edge is a satisfied precondition) ─ -->
  <path d="M228,112.5 L237,118 L228,123.5 Z" fill="#3a465e">
    <animate attributeName="fill" dur="12s" repeatCount="indefinite" calcMode="discrete"
             values="#3a465e;#34d399" keyTimes="0;0.30"/>
  </path>
  <path d="M228,228.5 L237,234 L228,239.5 Z" fill="#3a465e">
    <animate attributeName="fill" dur="12s" repeatCount="indefinite" calcMode="discrete"
             values="#3a465e;#34d399" keyTimes="0;0.30"/>
  </path>
  <path d="M424,170.5 L433,176 L424,181.5 Z" fill="#3a465e">
    <animate attributeName="fill" dur="12s" repeatCount="indefinite" calcMode="discrete"
             values="#3a465e;#34d399" keyTimes="0;0.68"/>
  </path>
  <path d="M620,170.5 L629,176 L620,181.5 Z" fill="#3a465e">
    <animate attributeName="fill" dur="12s" repeatCount="indefinite" calcMode="discrete"
             values="#3a465e;#34d399" keyTimes="0;0.85"/>
  </path>

  <!-- ══ node: clean ════════════════════════════════════════════════════ -->
  <g>
    <rect x="40" y="148" width="156" height="56" rx="10" fill="#161f30" stroke="#3a465e" stroke-width="1.6">
      <animate attributeName="fill"   dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="#161f30;#2b2110;#0f2a24" keyTimes="0;0.0833;0.25"/>
      <animate attributeName="stroke" dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="#3a465e;#fbbf24;#34d399" keyTimes="0;0.0833;0.25"/>
      <animate attributeName="stroke-dasharray" dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="none;5 4;none" keyTimes="0;0.0833;0.25"/>
      <animate attributeName="stroke-dashoffset" dur="0.9s" repeatCount="indefinite" values="0;-18"/>
    </rect>
    <text class="t" x="56" y="171" fill="#e2e8f0" font-size="12.5" font-weight="600">Clean the table</text>
    <text class="m" x="56" y="189" fill="#7d8da8" font-size="10">csv.clean</text>
    <circle cx="178" cy="176" r="7" fill="#64748b" filter="url(#led)" opacity="0.75">
      <animate attributeName="fill" dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="#64748b;#fbbf24;#34d399" keyTimes="0;0.0833;0.25"/>
    </circle>
    <circle cx="178" cy="176" r="4" fill="#64748b">
      <animate attributeName="fill" dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="#64748b;#fbbf24;#34d399" keyTimes="0;0.0833;0.25"/>
    </circle>
  </g>

  <!-- ══ node: profile ══════════════════════════════════════════════════ -->
  <g>
    <rect x="236" y="90" width="156" height="56" rx="10" fill="#161f30" stroke="#3a465e" stroke-width="1.6">
      <animate attributeName="fill"   dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="#161f30;#2b2110;#0f2a24" keyTimes="0;0.2667;0.5"/>
      <animate attributeName="stroke" dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="#3a465e;#fbbf24;#34d399" keyTimes="0;0.2667;0.5"/>
      <animate attributeName="stroke-dasharray" dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="none;5 4;none" keyTimes="0;0.2667;0.5"/>
      <animate attributeName="stroke-dashoffset" dur="0.9s" repeatCount="indefinite" values="0;-18"/>
    </rect>
    <text class="t" x="252" y="113" fill="#e2e8f0" font-size="12.5" font-weight="600">Profile columns</text>
    <text class="m" x="252" y="131" fill="#7d8da8" font-size="10">csv.profile</text>
    <circle cx="374" cy="118" r="7" fill="#64748b" filter="url(#led)" opacity="0.75">
      <animate attributeName="fill" dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="#64748b;#fbbf24;#34d399" keyTimes="0;0.2667;0.5"/>
    </circle>
    <circle cx="374" cy="118" r="4" fill="#64748b">
      <animate attributeName="fill" dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="#64748b;#fbbf24;#34d399" keyTimes="0;0.2667;0.5"/>
    </circle>
  </g>

  <!-- ══ node: outliers — fails once, then retries ══════════════════════ -->
  <g>
    <rect x="236" y="206" width="156" height="56" rx="10" fill="#161f30" stroke="#3a465e" stroke-width="1.6">
      <animate attributeName="fill"   dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="#161f30;#2b2110;#2d1622;#2b2110;#0f2a24" keyTimes="0;0.2667;0.4167;0.4833;0.6333"/>
      <animate attributeName="stroke" dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="#3a465e;#fbbf24;#fb7185;#fbbf24;#34d399" keyTimes="0;0.2667;0.4167;0.4833;0.6333"/>
      <animate attributeName="stroke-dasharray" dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="none;5 4;none;5 4;none" keyTimes="0;0.2667;0.4167;0.4833;0.6333"/>
      <animate attributeName="stroke-dashoffset" dur="0.9s" repeatCount="indefinite" values="0;-18"/>
    </rect>
    <text class="t" x="252" y="229" fill="#e2e8f0" font-size="12.5" font-weight="600">Detect outliers</text>
    <text class="m" x="252" y="247" fill="#7d8da8" font-size="10">csv.outliers</text>
    <circle cx="374" cy="234" r="7" fill="#64748b" filter="url(#led)" opacity="0.75">
      <animate attributeName="fill" dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="#64748b;#fbbf24;#fb7185;#fbbf24;#34d399" keyTimes="0;0.2667;0.4167;0.4833;0.6333"/>
    </circle>
    <circle cx="374" cy="234" r="4" fill="#64748b">
      <animate attributeName="fill" dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="#64748b;#fbbf24;#fb7185;#fbbf24;#34d399" keyTimes="0;0.2667;0.4167;0.4833;0.6333"/>
    </circle>
  </g>

  <!-- retry annotations, shown only around the failure window -->
  <g opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete"
             values="0;1;0" keyTimes="0;0.4167;0.4833"/>
    <rect x="253" y="182" width="126" height="19" rx="9.5" fill="#2d1622" stroke="#fb7185" stroke-width="1"/>
    <text class="m" x="316" y="195.5" fill="#fda4af" font-size="9.5" text-anchor="middle">✕ failed · backoff</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete"
             values="0;1;0" keyTimes="0;0.4833;0.6333"/>
    <rect x="253" y="182" width="126" height="19" rx="9.5" fill="#2b2110" stroke="#fbbf24" stroke-width="1"/>
    <text class="m" x="316" y="195.5" fill="#fcd34d" font-size="9.5" text-anchor="middle">↻ attempt 2 of 3</text>
  </g>

  <!-- ══ node: report (fan-in) ══════════════════════════════════════════ -->
  <g>
    <rect x="432" y="148" width="156" height="56" rx="10" fill="#161f30" stroke="#3a465e" stroke-width="1.6">
      <animate attributeName="fill"   dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="#161f30;#2b2110;#0f2a24" keyTimes="0;0.65;0.8"/>
      <animate attributeName="stroke" dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="#3a465e;#fbbf24;#34d399" keyTimes="0;0.65;0.8"/>
      <animate attributeName="stroke-dasharray" dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="none;5 4;none" keyTimes="0;0.65;0.8"/>
      <animate attributeName="stroke-dashoffset" dur="0.9s" repeatCount="indefinite" values="0;-18"/>
    </rect>
    <text class="t" x="448" y="171" fill="#e2e8f0" font-size="12.5" font-weight="600">Write the report</text>
    <text class="m" x="448" y="189" fill="#7d8da8" font-size="10">csv.report</text>
    <circle cx="570" cy="176" r="7" fill="#64748b" filter="url(#led)" opacity="0.75">
      <animate attributeName="fill" dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="#64748b;#fbbf24;#34d399" keyTimes="0;0.65;0.8"/>
    </circle>
    <circle cx="570" cy="176" r="4" fill="#64748b">
      <animate attributeName="fill" dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="#64748b;#fbbf24;#34d399" keyTimes="0;0.65;0.8"/>
    </circle>
  </g>

  <!-- ══ node: answer (agent-reportable) ════════════════════════════════ -->
  <g>
    <rect x="628" y="148" width="156" height="56" rx="10" fill="#161f30" stroke="#3a465e" stroke-width="1.6"
          stroke-dasharray="none">
      <animate attributeName="fill"   dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="#161f30;#2b2110;#0f2a24" keyTimes="0;0.8167;0.9167"/>
      <animate attributeName="stroke" dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="#3a465e;#fbbf24;#34d399" keyTimes="0;0.8167;0.9167"/>
      <animate attributeName="stroke-dasharray" dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="none;5 4;none" keyTimes="0;0.8167;0.9167"/>
      <animate attributeName="stroke-dashoffset" dur="0.9s" repeatCount="indefinite" values="0;-18"/>
    </rect>
    <text class="t" x="644" y="171" fill="#e2e8f0" font-size="12.5" font-weight="600">Answer the user</text>
    <text class="m" x="644" y="189" fill="#a78bfa" font-size="10">kind: answer</text>
    <circle cx="766" cy="176" r="7" fill="#64748b" filter="url(#led)" opacity="0.75">
      <animate attributeName="fill" dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="#64748b;#fbbf24;#34d399" keyTimes="0;0.8167;0.9167"/>
    </circle>
    <circle cx="766" cy="176" r="4" fill="#64748b">
      <animate attributeName="fill" dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="#64748b;#fbbf24;#34d399" keyTimes="0;0.8167;0.9167"/>
    </circle>
  </g>

  <!-- ── the point of the band ──────────────────────────────────────────── -->
  <text class="m" x="224" y="292" fill="#8a97b0" font-size="10">
    no edge between these two → the engine dispatches both at once
  </text>

  <!-- ── narration track ────────────────────────────────────────────────── -->
  <g class="m" font-size="10.5">
    <text x="26" y="325" fill="#94a3b8" opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="0;1;0" keyTimes="0;0;0.0833"/>
      <tspan fill="#38bdf8">▸ </tspan>plan published · 5 steps · no cycles, no unknown deps, no duplicate ids
    </text>
    <text x="26" y="325" fill="#94a3b8" opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="0;1;0" keyTimes="0;0.0833;0.25"/>
      <tspan fill="#fbbf24">▸ </tspan>clean running · it is the only step with no unmet dependency
    </text>
    <text x="26" y="325" fill="#94a3b8" opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="0;1;0" keyTimes="0;0.25;0.4167"/>
      <tspan fill="#34d399">▸ </tspan>clean succeeded · two successors unblocked, both dispatched together
    </text>
    <text x="26" y="325" fill="#94a3b8" opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="0;1;0" keyTimes="0;0.4167;0.4833"/>
      <tspan fill="#fb7185">▸ </tspan>outliers failed · attempts remain, so the engine backs off and retries
    </text>
    <text x="26" y="325" fill="#94a3b8" opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="0;1;0" keyTimes="0;0.4833;0.6333"/>
      <tspan fill="#fbbf24">▸ </tspan>outliers retrying · profile already finished, the branch did not block it
    </text>
    <text x="26" y="325" fill="#94a3b8" opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="0;1;0" keyTimes="0;0.6333;0.8"/>
      <tspan fill="#fbbf24">▸ </tspan>report running · fan-in waited until both parents succeeded
    </text>
    <text x="26" y="325" fill="#94a3b8" opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="0;1;0" keyTimes="0;0.8;0.9167"/>
      <tspan fill="#a78bfa">▸ </tspan>answer running · the one kind the agent may complete itself
    </text>
    <text x="26" y="325" fill="#94a3b8" opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="0;1" keyTimes="0;0.9167"/>
      <tspan fill="#34d399">▸ </tspan>plan complete · every capability result was written by the server
    </text>
  </g>
</svg>
