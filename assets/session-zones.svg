<svg xmlns="http://www.w3.org/2000/svg" width="820" height="306" viewBox="0 0 820 306" role="img" aria-label="A session has four directories with different trust. Uploads belong to the user, artifacts are written by the engine, scratch is the agent's own workspace, and control holds the plan, the event log and the cursor — no source ref can name it.">
<title>The four zones of a session</title>
<style>
  .s { font-family: "Inter", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .m { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
<rect width="820" height="306" rx="12" fill="#fdfcf8"/>
<rect x="0.5" y="0.5" width="819" height="305" rx="11.5" fill="none" stroke="#efece3"/>
<text x="24" y="34" class="m" font-size="10" fill="#687181" text-anchor="start">one session on disk · every ref re-checked for containment and re-verified against its checksum, on every use</text>
<rect x="284" y="44" width="432" height="234" rx="14" fill="#f7f4ec" stroke="#efece3" stroke-width="1.3"/>
<rect x="300" y="58" width="400" height="44" rx="10" fill="#f6f9f7" stroke="#4a7d5b" stroke-width="1.3"/>
<rect x="300" y="58" width="4" height="44" rx="2" fill="#4a7d5b"/>
<text x="318" y="78" class="m" font-size="11.5" font-weight="700" fill="#1a2332">uploads/</text>
<text x="318" y="93" class="m" font-size="9.5" fill="#687181" text-anchor="start">the user's files</text>
<text x="682" y="85" class="m" font-size="10" fill="#4a7d5b" text-anchor="end">upload:&lt;id&gt;</text>
<rect x="300" y="116" width="400" height="44" rx="10" fill="#f4f8fc" stroke="#1661ab" stroke-width="1.3"/>
<rect x="300" y="116" width="4" height="44" rx="2" fill="#1661ab"/>
<text x="318" y="136" class="m" font-size="11.5" font-weight="700" fill="#1a2332">artifacts/</text>
<text x="318" y="151" class="m" font-size="9.5" fill="#687181" text-anchor="start">execution output</text>
<text x="682" y="143" class="m" font-size="10" fill="#1661ab" text-anchor="end">artifact:&lt;id&gt;</text>
<rect x="300" y="174" width="400" height="44" rx="10" fill="#f7f5fb" stroke="#6d5bb5" stroke-width="1.3"/>
<rect x="300" y="174" width="4" height="44" rx="2" fill="#6d5bb5"/>
<text x="318" y="194" class="m" font-size="11.5" font-weight="700" fill="#1a2332">scratch/</text>
<text x="318" y="209" class="m" font-size="9.5" fill="#687181" text-anchor="start">the agent's own workspace</text>
<text x="682" y="201" class="m" font-size="10" fill="#6d5bb5" text-anchor="end">scratch:&lt;path&gt;</text>
<rect x="300" y="232" width="400" height="44" rx="10" fill="#fdf6f5" stroke="#c03030" stroke-width="1.3"/>
<rect x="300" y="232" width="4" height="44" rx="2" fill="#c03030"/>
<text x="318" y="252" class="m" font-size="11.5" font-weight="700" fill="#1a2332">control/</text>
<text x="318" y="267" class="m" font-size="9.5" fill="#687181" text-anchor="start">plan · event log · cursor</text>
<text x="682" y="259" class="m" font-size="10" fill="#c03030" text-anchor="end">— no ref can name it —</text>
<rect x="24" y="54" width="112" height="52" rx="10" fill="#ffffff" stroke="#4a7d5b" stroke-width="1.3"/>
<text x="80" y="78" class="s" font-size="12" font-weight="600" fill="#1a2332" text-anchor="middle">User</text>
<text x="80" y="94" class="m" font-size="9" fill="#687181" text-anchor="middle">uploads a file</text>
<path d="M140.0,80.0 L270.0,80.0" fill="none" stroke="#4a7d5b" stroke-width="1.6" stroke-linecap="round"/><path d="M270.0,84.4 L278.0,80.0 L270.0,75.6 Z" fill="#4a7d5b"/>
<rect x="24" y="112" width="112" height="52" rx="10" fill="#ffffff" stroke="#1661ab" stroke-width="1.3"/>
<text x="80" y="136" class="s" font-size="12" font-weight="600" fill="#1a2332" text-anchor="middle">Engine</text>
<text x="80" y="152" class="m" font-size="9" fill="#687181" text-anchor="middle">registers output</text>
<path d="M140.0,138.0 L270.0,138.0" fill="none" stroke="#1661ab" stroke-width="1.6" stroke-linecap="round"/><path d="M270.0,142.4 L278.0,138.0 L270.0,133.6 Z" fill="#1661ab"/>
<rect x="24" y="170" width="112" height="52" rx="10" fill="#ffffff" stroke="#6d5bb5" stroke-width="1.3"/>
<text x="80" y="194" class="s" font-size="12" font-weight="600" fill="#1a2332" text-anchor="middle">Agent</text>
<text x="80" y="210" class="m" font-size="9" fill="#687181" text-anchor="middle">reads + writes</text>
<path d="M140.0,196.0 L270.0,196.0" fill="none" stroke="#6d5bb5" stroke-width="1.6" stroke-linecap="round"/><path d="M270.0,200.4 L278.0,196.0 L270.0,191.6 Z" fill="#6d5bb5"/>
<path d="M136.0,190.0 Q223.3,153.3 271.8,81.0" fill="none" stroke="#6d5bb5" stroke-width="1.3" stroke-linecap="round"/><path d="M274.5,84.4 L278.0,76.0 L269.0,77.6 Z" fill="#6d5bb5"/>
<path d="M136.0,186.0 Q211.8,173.1 270.5,136.8" fill="none" stroke="#6d5bb5" stroke-width="1.3" stroke-linecap="round"/><path d="M272.0,140.9 L278.0,134.0 L269.0,132.6 Z" fill="#6d5bb5"/>
<text x="196" y="108" class="m" font-size="9" fill="#6d5bb5" text-anchor="start">reads</text>
<path d="M136.0,208.0 Q211.0,215.6 270.3,247.7" fill="none" stroke="#c03030" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/><path d="M269.1,252.0 L278.0,250.0 L271.6,243.5 Z" fill="#c03030"/>
<rect x="150" y="264" width="128" height="22" rx="11" fill="#ffffff" stroke="#c03030" stroke-width="1.2"/>
<text x="214" y="279" class="m" font-size="9.5" font-weight="600" fill="#c03030" text-anchor="middle">✗ unreachable</text>
</svg>